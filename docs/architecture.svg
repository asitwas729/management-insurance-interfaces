<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1100" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <style>
      .label { font-size: 13px; fill: #111; }
      .title { font-size: 16px; font-weight: 700; fill: #111; }
      .sub { font-size: 11px; fill: #555; }
      .group { fill: none; stroke: #888; stroke-dasharray: 6 4; stroke-width: 1.5; }
      .module { fill: #ffffff; stroke: #1f2937; stroke-width: 1.4; rx: 10; ry: 10; }
      .modCore { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.4; rx: 10; ry: 10; }
      .modAdapt { fill: #ecfdf5; stroke: #047857; stroke-width: 1.4; rx: 10; ry: 10; }
      .modAi { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.4; rx: 10; ry: 10; }
      .pill { fill: #f3f4f6; stroke: #374151; stroke-width: 1.2; rx: 16; ry: 16; }
      .infra { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.2; rx: 8; ry: 8; }
    </style>
  </defs>

  <!-- Title -->
  <text x="490" y="32" text-anchor="middle" class="title" font-size="20">InterfaceHub — 보험 IT 인터페이스 통합관리 시스템</text>
  <text x="490" y="52" text-anchor="middle" class="sub">Spring Boot 3.3 · Java 17 · PostgreSQL 16 · Kafka · Jaeger · Prometheus / Grafana</text>

  <!-- Users -->
  <g>
    <circle cx="490" cy="92" r="18" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
    <text x="490" y="97" text-anchor="middle" class="label" font-weight="700">Users</text>
    <text x="490" y="135" text-anchor="middle" class="sub">운영자 · 개발자 · 외부 시스템</text>
  </g>

  <!-- Docker outer boundary -->
  <rect x="40" y="160" width="900" height="690" class="group"/>
  <text x="58" y="180" class="sub" font-weight="700" fill="#2563eb">🐳 Docker Compose</text>

  <!-- API Gateway / Spring Web -->
  <rect x="360" y="195" width="260" height="55" class="pill" fill="#dcfce7" stroke="#15803d"/>
  <text x="490" y="218" text-anchor="middle" class="label" font-weight="700">Spring Web MVC + WebFlux</text>
  <text x="490" y="237" text-anchor="middle" class="sub">REST API · JWT 인증 · GlobalExceptionHandler</text>

  <line x1="490" y1="115" x2="490" y2="193" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backing Core -->
  <rect x="70" y="280" width="430" height="370" class="group" stroke="#4338ca"/>
  <text x="88" y="302" class="title" fill="#4338ca">Backing Core (Spring Boot)</text>

  <!-- Core modules -->
  <g>
    <rect x="90" y="320" width="180" height="50" class="modCore"/>
    <text x="180" y="342" text-anchor="middle" class="label" font-weight="700">Interface Registry</text>
    <text x="180" y="358" text-anchor="middle" class="sub">등록 · 설정 버전 · publish</text>

    <rect x="300" y="320" width="180" height="50" class="modCore"/>
    <text x="390" y="342" text-anchor="middle" class="label" font-weight="700">Executor Router</text>
    <text x="390" y="358" text-anchor="middle" class="sub">실행 라우팅 · 멱등성</text>

    <rect x="90" y="385" width="180" height="50" class="modCore"/>
    <text x="180" y="407" text-anchor="middle" class="label" font-weight="700">Execution History</text>
    <text x="180" y="423" text-anchor="middle" class="sub">성공/실패 이력 · 마스킹</text>

    <rect x="300" y="385" width="180" height="50" class="modCore"/>
    <text x="390" y="407" text-anchor="middle" class="label" font-weight="700">Retry Workflow</text>
    <text x="390" y="423" text-anchor="middle" class="sub">요청 · 승인 · 실행</text>

    <rect x="90" y="450" width="180" height="50" class="modCore"/>
    <text x="180" y="472" text-anchor="middle" class="label" font-weight="700">Audit Log</text>
    <text x="180" y="488" text-anchor="middle" class="sub">PUBLISH · RETRY · APPROVE</text>

    <rect x="300" y="450" width="180" height="50" class="modCore"/>
    <text x="390" y="472" text-anchor="middle" class="label" font-weight="700">Resilience</text>
    <text x="390" y="488" text-anchor="middle" class="sub">Circuit Breaker · Timeout</text>

    <rect x="90" y="515" width="180" height="50" class="modCore"/>
    <text x="180" y="537" text-anchor="middle" class="label" font-weight="700">Auth · Security</text>
    <text x="180" y="553" text-anchor="middle" class="sub">JWT · Role 기반 권한</text>

    <rect x="300" y="515" width="180" height="50" class="modCore"/>
    <text x="390" y="537" text-anchor="middle" class="label" font-weight="700">Scheduler · Batch</text>
    <text x="390" y="553" text-anchor="middle" class="sub">정기 실행 · 배치 처리</text>

    <rect x="195" y="580" width="180" height="50" class="modCore"/>
    <text x="285" y="602" text-anchor="middle" class="label" font-weight="700">Notification</text>
    <text x="285" y="618" text-anchor="middle" class="sub">Incident · Policy 알림</text>
  </g>

  <!-- Adapter Layer -->
  <rect x="525" y="280" width="395" height="220" class="group" stroke="#047857"/>
  <text x="543" y="302" class="title" fill="#047857">Adapter Layer</text>

  <rect x="545" y="320" width="170" height="50" class="modAdapt"/>
  <text x="630" y="342" text-anchor="middle" class="label" font-weight="700">REST Executor</text>
  <text x="630" y="358" text-anchor="middle" class="sub">WebClient · OAuth/Basic</text>

  <rect x="730" y="320" width="170" height="50" class="modAdapt"/>
  <text x="815" y="342" text-anchor="middle" class="label" font-weight="700">SOAP Executor</text>
  <text x="815" y="358" text-anchor="middle" class="sub">WS-Security</text>

  <rect x="545" y="385" width="170" height="50" class="modAdapt"/>
  <text x="630" y="407" text-anchor="middle" class="label" font-weight="700">SFTP Adapter</text>
  <text x="630" y="423" text-anchor="middle" class="sub">파일 전송 · Fixed-length</text>

  <rect x="730" y="385" width="170" height="50" class="modAdapt"/>
  <text x="815" y="407" text-anchor="middle" class="label" font-weight="700">MQ Adapter</text>
  <text x="815" y="423" text-anchor="middle" class="sub">Kafka Producer/Consumer</text>

  <rect x="635" y="450" width="180" height="40" class="modAdapt"/>
  <text x="725" y="475" text-anchor="middle" class="label" font-weight="700">Batch Adapter</text>

  <!-- AI / Anomaly Service -->
  <rect x="525" y="525" width="395" height="125" class="group" stroke="#c2410c"/>
  <text x="543" y="547" class="title" fill="#c2410c">AI / Observability Service (Python 3.11)</text>

  <rect x="545" y="560" width="170" height="40" class="modAi"/>
  <text x="630" y="585" text-anchor="middle" class="label" font-weight="700">Anomaly Detector</text>

  <rect x="730" y="560" width="170" height="40" class="modAi"/>
  <text x="815" y="585" text-anchor="middle" class="label" font-weight="700">LLM Counsel (Anthropic)</text>

  <rect x="635" y="608" width="180" height="34" class="modAi"/>
  <text x="725" y="630" text-anchor="middle" class="label" font-weight="700">Z-Score 기반 알림</text>

  <!-- Connectors from Gateway to layers -->
  <line x1="430" y1="250" x2="280" y2="318" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <line x1="550" y1="250" x2="700" y2="318" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- Core -> Adapter -->
  <line x1="500" y1="410" x2="543" y2="410" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Infra row -->
  <text x="60" y="690" class="title">데이터 · 메시징 · 관측</text>

  <rect x="60" y="705" width="160" height="60" class="infra" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="140" y="730" text-anchor="middle" class="label" font-weight="700">🐘 PostgreSQL 16</text>
  <text x="140" y="748" text-anchor="middle" class="sub">JPA · 인터페이스/이력</text>

  <rect x="240" y="705" width="160" height="60" class="infra" fill="#fef3c7" stroke="#a16207"/>
  <text x="320" y="730" text-anchor="middle" class="label" font-weight="700">⚡ Kafka</text>
  <text x="320" y="748" text-anchor="middle" class="sub">비동기 이벤트 · MQ</text>

  <rect x="420" y="705" width="160" height="60" class="infra" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="500" y="730" text-anchor="middle" class="label" font-weight="700">🔍 Jaeger (OTLP)</text>
  <text x="500" y="748" text-anchor="middle" class="sub">분산 트레이싱</text>

  <rect x="600" y="705" width="160" height="60" class="infra" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="680" y="730" text-anchor="middle" class="label" font-weight="700">🔥 Prometheus</text>
  <text x="680" y="748" text-anchor="middle" class="sub">메트릭 수집</text>

  <rect x="780" y="705" width="140" height="60" class="infra" fill="#ffedd5" stroke="#c2410c"/>
  <text x="850" y="730" text-anchor="middle" class="label" font-weight="700">📊 Grafana</text>
  <text x="850" y="748" text-anchor="middle" class="sub">대시보드</text>

  <!-- Data flows -->
  <line x1="180" y1="640" x2="160" y2="703" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="725" y1="490" x2="350" y2="703" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowOrange)"/>
  <line x1="390" y1="565" x2="490" y2="703" stroke="#444" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="725" y1="642" x2="680" y2="703" stroke="#444" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="680" y1="765" x2="820" y2="765" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="785" width="860" height="50" class="infra" fill="#f1f5f9" stroke="#475569"/>
  <text x="490" y="806" text-anchor="middle" class="label" font-weight="700">External Systems</text>
  <text x="490" y="824" text-anchor="middle" class="sub">금감원 · 보험개발원 · 재보험사 · 은행/카드 · 사내 코어시스템 (REST · SOAP · SFTP · MQ)</text>

  <line x1="630" y1="370" x2="500" y2="785" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="815" y1="370" x2="700" y2="785" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="630" y1="435" x2="400" y2="785" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="815" y1="435" x2="600" y2="785" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- CI/CD pipeline -->
  <text x="60" y="880" class="title">CI / CD</text>
  <rect x="60" y="895" width="170" height="50" class="infra"/>
  <text x="145" y="918" text-anchor="middle" class="label" font-weight="700">IntelliJ / Local</text>
  <text x="145" y="935" text-anchor="middle" class="sub">Maven · JUnit 5</text>

  <rect x="260" y="895" width="170" height="50" class="infra"/>
  <text x="345" y="918" text-anchor="middle" class="label" font-weight="700">GitHub</text>
  <text x="345" y="935" text-anchor="middle" class="sub">PR · Code Review</text>

  <rect x="460" y="895" width="170" height="50" class="infra"/>
  <text x="545" y="918" text-anchor="middle" class="label" font-weight="700">GitHub Actions</text>
  <text x="545" y="935" text-anchor="middle" class="sub">build · test · security</text>

  <rect x="660" y="895" width="170" height="50" class="infra"/>
  <text x="745" y="918" text-anchor="middle" class="label" font-weight="700">Docker Registry</text>
  <text x="745" y="935" text-anchor="middle" class="sub">image push</text>

  <line x1="230" y1="920" x2="258" y2="920" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="920" x2="458" y2="920" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="920" x2="658" y2="920" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="830" y1="920" x2="880" y2="920" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="905" y="924" text-anchor="middle" class="sub" font-weight="700">Deploy</text>

  <!-- Legend -->
  <g transform="translate(60, 970)">
    <text x="0" y="0" class="title">Legend</text>
    <rect x="0" y="12" width="22" height="14" class="modCore"/>
    <text x="30" y="24" class="sub">Backing Core (Spring Boot)</text>
    <rect x="220" y="12" width="22" height="14" class="modAdapt"/>
    <text x="250" y="24" class="sub">Protocol Adapters</text>
    <rect x="400" y="12" width="22" height="14" class="modAi"/>
    <text x="430" y="24" class="sub">AI / Observability</text>
    <rect x="580" y="12" width="22" height="14" class="infra"/>
    <text x="610" y="24" class="sub">Infrastructure</text>
    <line x1="0" y1="48" x2="40" y2="48" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="50" y="52" class="sub">메트릭 / 알림 흐름</text>
    <line x1="220" y1="48" x2="260" y2="48" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="270" y="52" class="sub">외부 시스템 호출</text>
    <line x1="400" y1="48" x2="440" y2="48" stroke="#2563eb" stroke-width="1.6"/>
    <text x="450" y="52" class="sub">사용자 요청 경로</text>
  </g>
</svg>
