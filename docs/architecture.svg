<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1280" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <style>
      .title  { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .h2     { font-size: 15px; font-weight: 700; }
      .label  { font-size: 13px; fill: #0f172a; }
      .lbold  { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .sub    { font-size: 11px; fill: #475569; }
      .edge   { font-size: 11px; fill: #1e293b; font-style: italic; }
      .group  { fill: none; stroke-dasharray: 6 4; stroke-width: 1.5; }
      .box    { stroke-width: 1.4; rx: 8; ry: 8; }
      .flowU  { stroke: #1d4ed8; stroke-width: 1.8; fill: none; }
      .flowA  { stroke: #047857; stroke-width: 1.6; fill: none; }
      .flowD  { stroke: #374151; stroke-width: 1.4; fill: none; }
      .flowM  { stroke: #c2410c; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
      .flowAi { stroke: #6d28d9; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" class="title">InterfaceHub — 보험 IT 인터페이스 통합관리 시스템</text>
  <text x="600" y="58" text-anchor="middle" class="sub">Spring Boot 3.3 · Java 17 · PostgreSQL 16 · Kafka · Jaeger · Prometheus / Grafana</text>

  <!-- ============ LAYER 1: USERS ============ -->
  <g>
    <rect x="500" y="80" width="200" height="50" class="box" fill="#fef3c7" stroke="#92400e"/>
    <text x="600" y="103" text-anchor="middle" class="lbold">Users</text>
    <text x="600" y="120" text-anchor="middle" class="sub">운영자 · 개발자 · 외부 시스템</text>
  </g>

  <!-- ============ LAYER 2: GATEWAY ============ -->
  <g>
    <rect x="400" y="170" width="400" height="60" class="box" fill="#dcfce7" stroke="#15803d"/>
    <text x="600" y="195" text-anchor="middle" class="lbold">Spring Web MVC + WebFlux Gateway</text>
    <text x="600" y="214" text-anchor="middle" class="sub">REST API · JWT 인증 · GlobalExceptionHandler · Validation</text>
  </g>

  <!-- Users -> Gateway -->
  <path d="M 600 130 L 600 168" class="flowU" marker-end="url(#arrowBlue)"/>
  <text x="610" y="152" class="edge" fill="#1d4ed8">HTTPS</text>

  <!-- ============ DOCKER BOUNDARY ============ -->
  <rect x="40" y="260" width="1120" height="820" class="group" stroke="#2563eb"/>
  <text x="60" y="282" class="h2" fill="#2563eb">🐳 Docker Compose Network — interfacehub-net</text>

  <!-- ============ LAYER 3: BACKING CORE (Spring Boot) ============ -->
  <rect x="70" y="305" width="700" height="320" class="group" stroke="#4338ca"/>
  <text x="90" y="328" class="h2" fill="#4338ca">Backing Core (Spring Boot · Java 17)</text>

  <!-- Row 1 -->
  <g>
    <rect x="90" y="345" width="200" height="60" class="box" fill="#eef2ff" stroke="#4338ca"/>
    <text x="190" y="370" text-anchor="middle" class="lbold">Interface Registry</text>
    <text x="190" y="388" text-anchor="middle" class="sub">등록 · 설정 버전 · publish</text>

    <rect x="320" y="345" width="200" height="60" class="box" fill="#eef2ff" stroke="#4338ca"/>
    <text x="420" y="370" text-anchor="middle" class="lbold">Executor Router</text>
    <text x="420" y="388" text-anchor="middle" class="sub">프로토콜 라우팅 · 멱등성</text>

    <rect x="550" y="345" width="200" height="60" class="box" fill="#eef2ff" stroke="#4338ca"/>
    <text x="650" y="370" text-anchor="middle" class="lbold">Auth · Security</text>
    <text x="650" y="388" text-anchor="middle" class="sub">JWT · Role 권한</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="90" y="425" width="200" height="60" class="box" fill="#eef2ff" stroke="#4338ca"/>
    <text x="190" y="450" text-anchor="middle" class="lbold">Execution History</text>
    <text x="190" y="468" text-anchor="middle" class="sub">성공/실패 이력 · PII 마스킹</text>

    <rect x="320" y="425" width="200" height="60" class="box" fill="#eef2ff" stroke="#4338ca"/>
    <text x="420" y="450" text-anchor="middle" class="lbold">Retry Workflow</text>
    <text x="420" y="468" text-anchor="middle" class="sub">요청 · 승인 · 실행</text>

    <rect x="550" y="425" width="200" height="60" class="box" fill="#eef2ff" stroke="#4338ca"/>
    <text x="650" y="450" text-anchor="middle" class="lbold">Audit Log</text>
    <text x="650" y="468" text-anchor="middle" class="sub">PUBLISH · APPROVE · RETRY</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="90" y="505" width="200" height="60" class="box" fill="#eef2ff" stroke="#4338ca"/>
    <text x="190" y="530" text-anchor="middle" class="lbold">Resilience</text>
    <text x="190" y="548" text-anchor="middle" class="sub">Circuit Breaker · Timeout</text>

    <rect x="320" y="505" width="200" height="60" class="box" fill="#eef2ff" stroke="#4338ca"/>
    <text x="420" y="530" text-anchor="middle" class="lbold">Scheduler · Batch</text>
    <text x="420" y="548" text-anchor="middle" class="sub">정기 실행 · 파일 배치</text>

    <rect x="550" y="505" width="200" height="60" class="box" fill="#eef2ff" stroke="#4338ca"/>
    <text x="650" y="530" text-anchor="middle" class="lbold">Notification</text>
    <text x="650" y="548" text-anchor="middle" class="sub">Incident · Policy 알림</text>
  </g>

  <!-- Gateway -> Core (single clean down line) -->
  <path d="M 600 230 L 600 270 L 420 270 L 420 343" class="flowU" marker-end="url(#arrowBlue)"/>

  <!-- ============ LAYER 4: ADAPTER LAYER ============ -->
  <rect x="800" y="305" width="340" height="320" class="group" stroke="#047857"/>
  <text x="820" y="328" class="h2" fill="#047857">Protocol Adapters</text>

  <g>
    <rect x="820" y="345" width="140" height="60" class="box" fill="#ecfdf5" stroke="#047857"/>
    <text x="890" y="370" text-anchor="middle" class="lbold">REST Executor</text>
    <text x="890" y="388" text-anchor="middle" class="sub">WebClient · OAuth</text>

    <rect x="980" y="345" width="140" height="60" class="box" fill="#ecfdf5" stroke="#047857"/>
    <text x="1050" y="370" text-anchor="middle" class="lbold">SOAP Executor</text>
    <text x="1050" y="388" text-anchor="middle" class="sub">WS-Security</text>

    <rect x="820" y="425" width="140" height="60" class="box" fill="#ecfdf5" stroke="#047857"/>
    <text x="890" y="450" text-anchor="middle" class="lbold">SFTP Adapter</text>
    <text x="890" y="468" text-anchor="middle" class="sub">Fixed-length 파일</text>

    <rect x="980" y="425" width="140" height="60" class="box" fill="#ecfdf5" stroke="#047857"/>
    <text x="1050" y="450" text-anchor="middle" class="lbold">MQ Adapter</text>
    <text x="1050" y="468" text-anchor="middle" class="sub">Kafka Pub/Sub</text>

    <rect x="900" y="505" width="140" height="60" class="box" fill="#ecfdf5" stroke="#047857"/>
    <text x="970" y="530" text-anchor="middle" class="lbold">Batch Adapter</text>
    <text x="970" y="548" text-anchor="middle" class="sub">대용량 작업</text>
  </g>

  <!-- Core(Executor Router) -> Adapter Layer (single arrow) -->
  <path d="M 520 375 L 818 375" class="flowA" marker-end="url(#arrowGreen)"/>
  <text x="660" y="368" text-anchor="middle" class="edge" fill="#047857">dispatch</text>

  <!-- ============ LAYER 5: AI SERVICE ============ -->
  <rect x="70" y="660" width="340" height="170" class="group" stroke="#6d28d9"/>
  <text x="90" y="683" class="h2" fill="#6d28d9">AI Service (Python 3.11)</text>

  <rect x="90" y="700" width="140" height="55" class="box" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="160" y="722" text-anchor="middle" class="lbold">Anomaly Detector</text>
  <text x="160" y="740" text-anchor="middle" class="sub">Z-Score 알림</text>

  <rect x="250" y="700" width="140" height="55" class="box" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="320" y="722" text-anchor="middle" class="lbold">LLM Counsel</text>
  <text x="320" y="740" text-anchor="middle" class="sub">Anthropic Claude</text>

  <rect x="160" y="770" width="160" height="40" class="box" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="240" y="794" text-anchor="middle" class="label">PROMETHEUS_URL polling</text>

  <!-- ============ LAYER 6: DATA / MESSAGING ============ -->
  <rect x="440" y="660" width="700" height="170" class="group" stroke="#0f766e"/>
  <text x="460" y="683" class="h2" fill="#0f766e">Data · Messaging</text>

  <rect x="460" y="700" width="200" height="110" class="box" fill="#ecfeff" stroke="#0e7490"/>
  <text x="560" y="730" text-anchor="middle" class="lbold">🐘 PostgreSQL 16</text>
  <text x="560" y="750" text-anchor="middle" class="sub">JPA · 인터페이스 메타</text>
  <text x="560" y="768" text-anchor="middle" class="sub">실행 이력 · 감사 로그</text>
  <text x="560" y="786" text-anchor="middle" class="sub">재처리 워크플로</text>

  <rect x="680" y="700" width="200" height="110" class="box" fill="#fef3c7" stroke="#a16207"/>
  <text x="780" y="730" text-anchor="middle" class="lbold">⚡ Kafka</text>
  <text x="780" y="750" text-anchor="middle" class="sub">비동기 이벤트 버스</text>
  <text x="780" y="768" text-anchor="middle" class="sub">MQ 어댑터</text>
  <text x="780" y="786" text-anchor="middle" class="sub">실행/감사 이벤트</text>

  <rect x="900" y="700" width="220" height="110" class="box" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="1010" y="730" text-anchor="middle" class="lbold">🔍 OTLP / Jaeger</text>
  <text x="1010" y="750" text-anchor="middle" class="sub">분산 트레이싱</text>
  <text x="1010" y="768" text-anchor="middle" class="sub">엔드포인트:</text>
  <text x="1010" y="786" text-anchor="middle" class="sub">http://jaeger:4318</text>

  <!-- Core -> Postgres (clean down-then-right) -->
  <path d="M 190 567 L 190 640 L 560 640 L 560 698" class="flowD" marker-end="url(#arrow)"/>
  <text x="280" y="635" class="edge">JPA / JDBC</text>

  <!-- Core -> Kafka -->
  <path d="M 420 567 L 420 625 L 780 625 L 780 698" class="flowD" marker-end="url(#arrow)"/>
  <text x="600" y="620" class="edge">events</text>

  <!-- Core -> Jaeger -->
  <path d="M 650 567 L 650 615 L 1010 615 L 1010 698" class="flowD" marker-end="url(#arrow)"/>
  <text x="850" y="610" class="edge">OTLP traces</text>

  <!-- ============ LAYER 7: OBSERVABILITY ============ -->
  <rect x="70" y="860" width="1070" height="160" class="group" stroke="#c2410c"/>
  <text x="90" y="883" class="h2" fill="#c2410c">Observability</text>

  <rect x="90" y="900" width="220" height="100" class="box" fill="#ffedd5" stroke="#c2410c"/>
  <text x="200" y="932" text-anchor="middle" class="lbold">🔥 Prometheus</text>
  <text x="200" y="952" text-anchor="middle" class="sub">메트릭 수집 · 저장</text>
  <text x="200" y="970" text-anchor="middle" class="sub">/actuator/prometheus</text>

  <rect x="350" y="900" width="220" height="100" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="460" y="932" text-anchor="middle" class="lbold">📊 Grafana</text>
  <text x="460" y="952" text-anchor="middle" class="sub">대시보드 · 알림</text>
  <text x="460" y="970" text-anchor="middle" class="sub">port 3000</text>

  <rect x="610" y="900" width="220" height="100" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="720" y="932" text-anchor="middle" class="lbold">Jaeger UI</text>
  <text x="720" y="952" text-anchor="middle" class="sub">트레이스 분석</text>
  <text x="720" y="970" text-anchor="middle" class="sub">port 16686</text>

  <rect x="870" y="900" width="240" height="100" class="box" fill="#f1f5f9" stroke="#475569"/>
  <text x="990" y="932" text-anchor="middle" class="lbold">External Systems</text>
  <text x="990" y="952" text-anchor="middle" class="sub">금감원 · 보험개발원</text>
  <text x="990" y="970" text-anchor="middle" class="sub">재보험사 · 은행/카드</text>

  <!-- Core -> Prometheus (scrape) -->
  <path d="M 130 567 L 130 850 L 200 850 L 200 898" class="flowM" marker-end="url(#arrowOrange)"/>
  <text x="140" y="700" class="edge" fill="#c2410c">scrape</text>

  <!-- Prometheus -> Grafana -->
  <path d="M 310 950 L 348 950" class="flowM" marker-end="url(#arrowOrange)"/>

  <!-- Prometheus -> Anomaly Detector (poll) -->
  <path d="M 200 898 L 200 820 L 160 820 L 160 757" class="flowAi" marker-end="url(#arrowPurple)"/>

  <!-- Jaeger storage -> Jaeger UI -->
  <path d="M 1010 810 L 1010 845 L 720 845 L 720 898" class="flowM" marker-end="url(#arrowOrange)"/>

  <!-- Adapters -> External Systems -->
  <path d="M 1050 567 L 1050 850 L 990 850 L 990 898" class="flowA" marker-end="url(#arrowGreen)"/>
  <text x="1060" y="700" class="edge" fill="#047857">outbound</text>

  <!-- ============ CI / CD ============ -->
  <text x="60" y="1075" class="h2">CI / CD Pipeline</text>
  <rect x="60" y="1090" width="200" height="55" class="box" fill="#f8fafc" stroke="#475569"/>
  <text x="160" y="1115" text-anchor="middle" class="lbold">IntelliJ / Local</text>
  <text x="160" y="1132" text-anchor="middle" class="sub">Maven · JUnit 5</text>

  <rect x="300" y="1090" width="200" height="55" class="box" fill="#f8fafc" stroke="#475569"/>
  <text x="400" y="1115" text-anchor="middle" class="lbold">GitHub</text>
  <text x="400" y="1132" text-anchor="middle" class="sub">PR · Code Review</text>

  <rect x="540" y="1090" width="200" height="55" class="box" fill="#f8fafc" stroke="#475569"/>
  <text x="640" y="1115" text-anchor="middle" class="lbold">GitHub Actions</text>
  <text x="640" y="1132" text-anchor="middle" class="sub">build · test · security</text>

  <rect x="780" y="1090" width="200" height="55" class="box" fill="#f8fafc" stroke="#475569"/>
  <text x="880" y="1115" text-anchor="middle" class="lbold">Docker Image</text>
  <text x="880" y="1132" text-anchor="middle" class="sub">registry push</text>

  <rect x="1020" y="1090" width="140" height="55" class="box" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="1090" y="1115" text-anchor="middle" class="lbold">Deploy</text>
  <text x="1090" y="1132" text-anchor="middle" class="sub">to Docker</text>

  <path d="M 260 1117 L 298 1117" class="flowD" marker-end="url(#arrow)"/>
  <path d="M 500 1117 L 538 1117" class="flowD" marker-end="url(#arrow)"/>
  <path d="M 740 1117 L 778 1117" class="flowD" marker-end="url(#arrow)"/>
  <path d="M 980 1117 L 1018 1117" class="flowD" marker-end="url(#arrow)"/>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(60, 1180)">
    <text x="0" y="0" class="h2">Legend</text>
    <rect x="0" y="14" width="22" height="14" fill="#eef2ff" stroke="#4338ca"/>
    <text x="30" y="26" class="sub">Backing Core</text>
    <rect x="150" y="14" width="22" height="14" fill="#ecfdf5" stroke="#047857"/>
    <text x="180" y="26" class="sub">Protocol Adapters</text>
    <rect x="320" y="14" width="22" height="14" fill="#f5f3ff" stroke="#6d28d9"/>
    <text x="350" y="26" class="sub">AI Service</text>
    <rect x="450" y="14" width="22" height="14" fill="#ecfeff" stroke="#0e7490"/>
    <text x="480" y="26" class="sub">Data / Messaging</text>
    <rect x="620" y="14" width="22" height="14" fill="#ffedd5" stroke="#c2410c"/>
    <text x="650" y="26" class="sub">Observability</text>

    <line x1="0" y1="56" x2="40" y2="56" class="flowU"/>
    <text x="50" y="60" class="sub">사용자 요청</text>
    <line x1="150" y1="56" x2="190" y2="56" class="flowA"/>
    <text x="200" y="60" class="sub">외부 호출 / 라우팅</text>
    <line x1="320" y1="56" x2="360" y2="56" class="flowD"/>
    <text x="370" y="60" class="sub">데이터 / 이벤트</text>
    <line x1="450" y1="56" x2="490" y2="56" class="flowM"/>
    <text x="500" y="60" class="sub">메트릭 흐름</text>
    <line x1="620" y1="56" x2="660" y2="56" class="flowAi"/>
    <text x="670" y="60" class="sub">AI polling</text>
  </g>
</svg>
