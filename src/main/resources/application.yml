resilience4j:
  ratelimiter:
    instances:
      loginRateLimiter:
        limit-for-period: 1
        limit-refresh-period: 10s
        timeout-duration: 0
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        register-health-indicator: true
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: interfacehub
  cache:
    type: caffeine
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
  datasource:
    url: jdbc:h2:mem:interfacehub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    clean-disabled: false
    clean-on-validation-error: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: embedded

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: interfacehub
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.hibernate.SQL: debug
    io.opentelemetry: warn

interfacehub:
  security:
    jwt:
      secret: ${JWT_SECRET:interfacehub-development-secret-key-please-change-in-prod-123456789}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  mq:
    mode: in-memory
    kafka:
      consumer-enabled: false
      consumer-topic: interfacehub.inbound
      dlq-topic: interfacehub.dlq
  dlq:
    replay:
      max-attempts: 3
      cooldown-seconds: 60
  llm:
    enabled: ${LLM_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-4-5-20251001
    max-tokens: 1024
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    retry-fixed-delay-seconds: 60
    dlq-fixed-delay-seconds: 60
    interface-job-fixed-delay-seconds: 60
  notification:
    enabled: ${NOTIFICATION_ENABLED:false}
    webhook-url: ${NOTIFICATION_WEBHOOK_URL:}
  retention:
    execution-history-days: ${RETENTION_EXECUTION_DAYS:90}
    audit-log-days: ${RETENTION_AUDIT_DAYS:365}
    archive-enabled: ${RETENTION_ARCHIVE_ENABLED:true}
